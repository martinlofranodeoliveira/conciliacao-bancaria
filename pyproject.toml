[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "conciliacao-bancaria"
version = "1.0.0"
description = "Concilie razão interno e extrato bancário em centavos exatos: 1:1, lotes, tarifas, ambiguidades e pendências."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Martin Lofrano / LOFRANO TECNOLOGIA"}]
dependencies = []
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Financial and Insurance Industry",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Office/Business :: Financial :: Accounting",
]

[project.scripts]
conciliacao-bancaria = "conciliacao_bancaria.cli:main"

[project.urls]
Homepage = "https://lofranotecnologia.com.br/"
Repository = "https://github.com/martinlofranodeoliveira/conciliacao-bancaria"
Issues = "https://github.com/martinlofranodeoliveira/conciliacao-bancaria/issues"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["conciliacao_bancaria"]
namespaces = false

[tool.setuptools.package-data]
conciliacao_bancaria = ["data/*.json"]
